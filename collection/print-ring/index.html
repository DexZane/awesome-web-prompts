<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>OMBRY, night portraits</title>
  <meta name="description" content="OMBRY is a photographer's portfolio of night portraits in the rain, hung as prints on a ring you can turn, tilt and open.">
  <meta name="theme-color" content="#fcf7fc">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%234a1448'/%3E%3Crect x='9' y='9' width='14' height='14' fill='none' stroke='%23fcf7fc' stroke-width='3'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://images.higgs.ai" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" href="https://fonts.gstatic.com/s/roboto/v51/KFO7CnqEu92Fr1ME7kSn66aGLdTylUAMa3yUBA.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="https://fonts.gstatic.com/s/arvo/v23/tDbM2oWUg0MKoZw1-LPK8w.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@500;700&display=block">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Arvo:wght@700&display=block">
  <style>
    :root {
      --page: #fcf7fc;
      --ink: #4a1448;
      --muted: #8a6689;
      --dots: #dccedc;
    }

    :root[data-theme="dark"] {
      --page: #4a1448;
      --ink: #fcf7fc;
      --muted: #a78aa6;
      --dots: #714670;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      margin: 0;
      overflow: hidden;
      overscroll-behavior: none;
      background: var(--page);
      color: var(--ink);
      font: 700 13.4px/16px Roboto, Arial, sans-serif;
      text-transform: uppercase;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      user-select: none;
      -webkit-user-select: none;
    }

    button {
      background: none;
      border: 0;
      padding: 0;
      margin: 0;
      font: inherit;
      color: inherit;
      text-transform: inherit;
      letter-spacing: inherit;
      cursor: pointer;
    }

    :focus-visible {
      outline: 2px solid var(--muted);
      outline-offset: 3px;
    }

    canvas:focus-visible {
      outline: none;
    }

    .stage-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      cursor: grab;
      touch-action: none;
      z-index: 1;
    }

    .stage-canvas.dragging {
      cursor: grabbing;
    }

    .numbers {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      overflow: hidden;
    }

    .numbers span {
      position: absolute;
      left: 0;
      top: 0;
      font-variant-numeric: tabular-nums;
      color: var(--muted);
      white-space: nowrap;
      will-change: transform, opacity;
      opacity: 0;
    }

    .numbers span.active {
      color: var(--ink);
    }

    .project {
      position: fixed;
      inset: 0;
      z-index: 2;
      letter-spacing: 0.03em;
      pointer-events: none;
    }

    .line-mask {
      display: block;
      overflow: hidden;
    }

    .line-inner {
      display: block;
      transform: translateY(105%);
      will-change: transform;
    }

    .project-heading {
      position: absolute;
      left: 56%;
      top: 27%;
    }

    .project-no {
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    .project-title {
      color: var(--ink);
    }

    .project-facts {
      position: absolute;
      left: 56%;
      top: 43%;
      display: grid;
      grid-template-columns: 148px auto;
      column-gap: 24px;
      row-gap: 2px;
    }

    .fact-label {
      color: var(--muted);
    }

    .fact-val {
      color: var(--ink);
      font-variant-numeric: tabular-nums;
    }

    .project-note {
      position: absolute;
      left: 56%;
      top: 64%;
      max-width: 340px;
      text-transform: none;
      font-weight: 500;
      line-height: 18px;
      color: var(--ink);
    }

    .project-note .line-inner {
      white-space: nowrap;
    }

    .project-back {
      position: absolute;
      left: 56%;
      bottom: 28px;
      height: 24px;
      display: inline-flex;
      align-items: center;
      color: var(--ink);
      pointer-events: auto;
    }

    .project[inert] .project-back {
      pointer-events: none;
    }

    .thumbs {
      position: fixed;
      left: 0;
      top: 0;
      z-index: 2;
      display: flex;
      gap: 12px;
      pointer-events: none;
      will-change: transform;
    }

    .thumbs:not([inert]) button {
      pointer-events: auto;
    }

    .thumbs button {
      width: 72px;
      height: 54px;
      position: relative;
      overflow: hidden;
      background-repeat: no-repeat;
      clip-path: inset(0 0 100% 0);
      opacity: 0.55;
      will-change: clip-path, opacity;
    }

    .thumbs button.wanted {
      opacity: 1;
    }

    .wordmark {
      position: fixed;
      left: 55px;
      top: 22px;
      margin: 0;
      z-index: 3;
      font: 700 25px/30px Arvo, serif;
      color: var(--ink);
      white-space: nowrap;
      pointer-events: none;
    }

    .controls {
      position: fixed;
      right: 56px;
      top: 18.5px;
      display: flex;
      gap: 36px;
      z-index: 3;
    }

    .controls button {
      height: 24px;
      display: inline-flex;
      align-items: center;
      color: var(--ink);
      white-space: nowrap;
    }

    .caption {
      position: fixed;
      right: 54px;
      bottom: 33px;
      display: flex;
      gap: 22px;
      pointer-events: none;
      z-index: 3;
      color: var(--ink);
    }

    .caption-counter {
      word-spacing: 4px;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .caption-title-mask {
      overflow: hidden;
      max-width: 34vw;
    }

    .caption-title {
      display: block;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      will-change: transform;
    }

    .file-input {
      position: fixed;
      width: 1px;
      height: 1px;
      clip: rect(0 0 0 0);
      clip-path: inset(50%);
      overflow: hidden;
      border: 0;
      padding: 0;
      margin: -1px;
    }

    .fallback {
      position: fixed;
      inset: 0;
      margin: 0;
      padding: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      text-transform: none;
      color: var(--ink);
      background: var(--page);
      z-index: 10;
    }

    .fallback[hidden] {
      display: none;
    }

    /* Section 19: Responsive layouts (order matters; later rules win) */
    @media (min-aspect-ratio: 21/20) and (max-width: 1100px) {
      html, body { font-size: 12.5px; }
      .wordmark { left: 28px; }
      .controls { right: 28px; gap: 24px; }
      .caption { right: 28px; gap: 16px; }
      .project-heading, .project-facts, .project-note, .project-back { left: 53%; }
      .project-facts { grid-template-columns: 84px auto; column-gap: 16px; }
      .thumbs { gap: 12px; }
      .thumbs button { width: 72px; height: 54px; }
    }

    @media (min-width: 2100px) and (min-aspect-ratio: 21/20) {
      html, body { font-size: max(17px, 0.8vw); line-height: 1.22; }
      .wordmark { left: 3.2vw; top: 2.1vw; font-size: 1.6vw; line-height: 1.2; }
      .controls { right: 3.2vw; top: 2.2vw; gap: 2.2vw; }
      .caption { right: 3.2vw; bottom: 2.3vw; gap: 1.4vw; }
      .project-facts { grid-template-columns: 9vw auto; }
      .project-note { max-width: 24vw; line-height: 1.35; }
      .project-back { bottom: 2.1vw; height: auto; min-height: 24px; }
      .thumbs { gap: 18px; }
      .thumbs button { width: 120px; height: 90px; }
    }

    @media (min-aspect-ratio: 21/20) and (max-height: 520px),
           (min-aspect-ratio: 21/20) and (max-width: 860px) {
      html, body { font-size: 11.5px; line-height: 15px; }
      .wordmark { left: 20px; top: 10px; font-size: 20px; line-height: 24px; }
      .controls { right: 20px; top: 13px; gap: 18px; }
      .caption { right: 20px; bottom: 14px; gap: 12px; }
      .project-text-col {
        position: fixed;
        left: 47%;
        right: 16px;
        top: 60px;
        bottom: 46px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 14px;
      }
      .project-heading, .project-facts, .project-note {
        position: static;
        left: auto;
        top: auto;
      }
      .project-facts { grid-template-columns: 62px auto; column-gap: 12px; row-gap: 0; }
      .project-note { font-size: 11px; line-height: 15px; }
      .project-back { left: 47%; bottom: 10px; }
      .thumbs { gap: 6px; }
      .thumbs button { width: 48px; height: 36px; }
    }

    @media (max-aspect-ratio: 21/20) {
      html, body { font-size: 12.5px; }
      .wordmark { left: 24px; top: 18px; }
      .controls { right: 24px; top: 21px; gap: 24px; }
      .caption { right: 24px; bottom: 24px; gap: 16px; }
      .project-text-col {
        position: fixed;
        left: 24px;
        right: 24px;
        bottom: 68px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .project-heading, .project-facts, .project-note {
        position: static;
        left: auto;
        top: auto;
      }
      .project-facts { grid-template-columns: 92px auto; column-gap: 16px; row-gap: 0; }
      .project-back { left: 24px; bottom: 20px; }
      .thumbs { gap: 8px; }
      .thumbs button { width: 60px; height: 45px; }
    }

    @media (max-aspect-ratio: 21/20) and (max-width: 560px) {
      html, body { font-size: 11.5px; line-height: 15px; }
      .wordmark { left: 16px; top: 12px; font-size: 22px; line-height: 26px; }
      .controls { left: 16px; right: 16px; top: 46px; gap: 20px; justify-content: flex-start; }
      .caption { right: 16px; bottom: 16px; gap: 10px; }
      .project-text-col { left: 16px; right: 16px; bottom: 56px; gap: 12px; }
      .project-facts { grid-template-columns: 70px auto; column-gap: 12px; }
      .project-note { font-size: 11px; line-height: 15px; }
      .project-back { left: 16px; bottom: 12px; }
      .thumbs { gap: 7px; }
      .thumbs button { width: 52px; height: 39px; }
    }

    @media (max-width: 400px) {
      body.is-open .caption-title-mask {
        display: none;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <canvas class="stage-canvas" id="stage" tabindex="0" aria-label="A ring of photographs. Left and right arrows turn it, up and down tilt it, Enter opens the front print."></canvas>

  <div class="numbers" id="numbers" aria-hidden="true"></div>

  <section class="project" id="project" inert>
    <div class="project-text-col" id="projectTextCol">
      <div class="project-heading">
        <span class="line-mask"><span class="line-inner project-no" id="projNo" data-theme-muted>NO 03 / 14</span></span>
        <span class="line-mask"><span class="line-inner project-title" id="projTitle" data-theme-ink>GLASS RAIN</span></span>
      </div>
      <div class="project-facts">
        <span class="line-mask"><span class="line-inner fact-label" data-theme-muted>SERIES</span></span>
        <span class="line-mask"><span class="line-inner fact-val" id="factSeries" data-theme-ink>Window rain</span></span>
        <span class="line-mask"><span class="line-inner fact-label" data-theme-muted>MOOD</span></span>
        <span class="line-mask"><span class="line-inner fact-val" id="factMood" data-theme-ink>Tailored</span></span>
        <span class="line-mask"><span class="line-inner fact-label" data-theme-muted>SHOT</span></span>
        <span class="line-mask"><span class="line-inner fact-val" id="factShot" data-theme-ink>2024</span></span>
        <span class="line-mask"><span class="line-inner fact-label" data-theme-muted>WORK</span></span>
        <span class="line-mask"><span class="line-inner fact-val" id="factWork" data-theme-ink>Portraits and lighting</span></span>
      </div>
      <div class="project-note">
        <span class="line-mask"><span class="line-inner" id="note1" data-theme-ink>Seen from the dry side of a window,</span></span>
        <span class="line-mask"><span class="line-inner" id="note2" data-theme-ink>where every drop bends the city lights,</span></span>
        <span class="line-mask"><span class="line-inner" id="note3" data-theme-ink>and the face is left half found.</span></span>
      </div>
    </div>
    <button type="button" class="project-back" id="backBtn"><span class="line-mask"><span class="line-inner" data-theme-ink>RETURN TO PRINTS</span></span></button>
  </section>

  <div class="thumbs" id="thumbs" inert></div>

  <h1 class="wordmark" data-theme-ink>OMBRY</h1>

  <div class="controls">
    <button type="button" id="themeBtn" data-theme-ink>DARK</button>
    <button type="button" id="frontBtn" data-theme-ink>FRONT VIEW</button>
    <button type="button" id="loadBtn" data-theme-ink>LOAD PHOTOS</button>
  </div>

  <div class="caption">
    <span class="caption-counter" id="captionCounter" data-theme-ink>03 / 14</span>
    <span class="caption-title-mask">
      <span class="caption-title" id="captionTitle" data-theme-ink>Glass rain</span>
    </span>
  </div>

  <input type="file" class="file-input" id="fileInput" accept="image/*" multiple tabindex="-1">

  <p class="fallback" id="fallback" hidden>These prints need WebGL2. Please open the page in a current browser.</p>

  <script>
    (() => {
      'use strict';

      const canvas = document.getElementById('stage');
      const gl = canvas.getContext('webgl2', {
        antialias: true,
        alpha: false,
        powerPreference: 'high-performance'
      });

      if (!gl) {
        document.getElementById('fallback').hidden = false;
        return;
      }

      // ─── Section 1: Media ─────────────────────────────────────────────────
      const SHEETS = [
        {
          opt: 'https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20261122_104107_4bafcf96-fa68-439e-85bb-af0d6b852e6c.png&w=2336&q=85',
          orig: 'https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20261122_104107_4bafcf96-fa68-439e-85bb-af0d6b852e6c.png'
        },
        {
          opt: 'https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20261122_104106_ea17bea1-c68a-4d63-8805-44540b71f692.png&w=2336&q=85',
          orig: 'https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20261122_104106_ea17bea1-c68a-4d63-8805-44540b71f692.png'
        },
        {
          opt: 'https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20261122_104106_ff428d1d-9435-40f4-a91a-a694b86d7051.png&w=2336&q=85',
          orig: 'https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20261122_104106_ff428d1d-9435-40f4-a91a-a694b86d7051.png'
        },
        {
          opt: 'https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20261122_104106_da9ea015-80a7-4acf-b00c-4140b08fcc00.png&w=2336&q=85',
          orig: 'https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20261122_104106_da9ea015-80a7-4acf-b00c-4140b08fcc00.png'
        }
      ];

      const STORIES = {
        A: {
          series: 'Street rain',
          mood: 'Nocturnal',
          lines: [
            'Shot after midnight, in steady rain',
            'with one street lamp to light the face,',
            'and the wet road as a reflector.'
          ]
        },
        B: {
          series: 'Window rain',
          mood: 'Tailored',
          lines: [
            'Seen from the dry side of a window,',
            'where every drop bends the city lights,',
            'and the face is left half found.'
          ]
        },
        C: {
          series: 'Quiet hours',
          mood: 'Profiles',
          lines: [
            'An hour between the last two trams,',
            'spent waiting for a person to turn away',
            'just far enough from the lights.'
          ]
        },
        D: {
          series: 'Night coats',
          mood: 'Wet street',
          lines: [
            'Long wool, high collars, cold hands',
            'photographed slowly on a long walk home',
            'as the shop signs went out late.'
          ]
        },
        E: {
          series: 'River night',
          mood: 'Cine stills',
          lines: [
            'Made along the river after a storm,',
            'on fast film pushed two stops for grain',
            'then printed softly on warm rag.'
          ]
        },
        F: {
          series: 'Empty roads',
          mood: 'Wet street',
          lines: [
            'The city after everyone has gone in',
            'with only the things they have left out',
            'lying in the light of the lamps.'
          ]
        }
      };

      const DEFAULT_ITEMS = [
        { title: 'Wool night', sheet: 1, cell: 0, w: 197, h: 378, gap: 96, kx: 0.5, ky: 0.2, bg: '#33172f', story: 'D', border: false },
        { title: 'Clear rain', sheet: 0, cell: 0, w: 293, h: 438, gap: 62, kx: 0.5, ky: 0.5, bg: '#2b2029', story: 'A', border: false },
        { title: 'Glass rain', sheet: 0, cell: 1, w: 222, h: 333, gap: 16, kx: 0.5, ky: 0.5, bg: '#3c2a45', story: 'B', border: false },
        { title: 'Lamp light', sheet: 0, cell: 2, w: 216, h: 374, gap: 30, kx: 0.5, ky: 0.5, bg: '#4a3d50', story: 'A', border: true },
        { title: 'Lilac knot', sheet: 0, cell: 3, w: 233, h: 370, gap: 74, kx: 0.5, ky: 0.5, bg: '#30212f', story: 'D', border: false },
        { title: 'Walks home', sheet: 1, cell: 1, w: 217, h: 404, gap: 48, kx: 1.0, ky: 0.5, bg: '#3f2a48', story: 'D', border: false },
        { title: 'Wet stones', sheet: 1, cell: 2, w: 384, h: 400, gap: 48, kx: 0.5, ky: 0.75, bg: '#38263b', story: 'F', border: false },
        { title: 'Back seats', sheet: 1, cell: 3, w: 336, h: 360, gap: 48, kx: 0.5, ky: 0.35, bg: '#35293a', story: 'B', border: false },
        { title: 'Lilac hood', sheet: 2, cell: 0, w: 376, h: 432, gap: 48, kx: 0.5, ky: 0.2, bg: '#5b465f', story: 'A', border: false },
        { title: 'Stone step', sheet: 2, cell: 1, w: 344, h: 384, gap: 48, kx: 0.5, ky: 0.75, bg: '#3a2f3d', story: 'D', border: false },
        { title: 'Night tram', sheet: 2, cell: 3, w: 392, h: 416, gap: 48, kx: 0.5, ky: 0.65, bg: '#443448', story: 'C', border: true },
        { title: 'Shared sky', sheet: 3, cell: 0, w: 328, h: 372, gap: 48, kx: 0.5, ky: 0.3, bg: '#392638', story: 'E', border: false },
        { title: 'River rail', sheet: 3, cell: 1, w: 368, h: 420, gap: 48, kx: 0.5, ky: 0.3, bg: '#33283a', story: 'E', border: false },
        { title: 'Warm doors', sheet: 3, cell: 3, w: 373, h: 392, gap: 48, kx: 0.5, ky: 0.2, bg: '#3b2230', story: 'B', border: false }
      ];

      // ─── Helpers: Math, Cubic-Bezier, Spring ──────────────────────────────
      const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
      const smoothstep = t => {
        const x = clamp(t, 0, 1);
        return x * x * (3 - 2 * x);
      };
      const lerp = (a, b, t) => a + (b - a) * t;
      const hexToRgb = hex => {
        const n = parseInt(hex.slice(1), 16);
        return [((n >> 16) & 255) / 255, ((n >> 8) & 255) / 255, (n & 255) / 255];
      };
      const pad2 = n => String(n).padStart(2, '0');

      function cubicBezier(x1, y1, x2, y2) {
        const cx = 3 * x1;
        const bx = 3 * (x2 - x1) - cx;
        const ax = 1 - cx - bx;
        const cy = 3 * y1;
        const by = 3 * (y2 - y1) - cy;
        const ay = 1 - cy - by;
        const sampleX = t => ((ax * t + bx) * t + cx) * t;
        const sampleY = t => ((ay * t + by) * t + cy) * t;
        const sampleDX = t => (3 * ax * t + 2 * bx) * t + cx;

        return x => {
          if (x <= 0) return 0;
          if (x >= 1) return 1;
          let t = x;
          for (let i = 0; i < 6; i++) {
            const err = sampleX(t) - x;
            if (Math.abs(err) < 1e-6) return sampleY(t);
            const dx = sampleDX(t);
            if (Math.abs(dx) < 1e-6) break;
            t -= err / dx;
          }
          let lo = 0, hi = 1;
          t = x;
          for (let i = 0; i < 16; i++) {
            const val = sampleX(t);
            if (Math.abs(val - x) < 1e-6) break;
            if (x > val) lo = t;
            else hi = t;
            t = 0.5 * (lo + hi);
          }
          return sampleY(t);
        };
      }

      const EASE_STEP = cubicBezier(0.45, 0, 0.12, 1);
      const EASE_OPEN = cubicBezier(0.25, 1, 0.5, 1);

      const EASE_WORDS = cubicBezier(0.22, 1, 0.36, 1);
      const EASE_SOAK = cubicBezier(0.22, 0.24, 0.6, 0.84);
      const EASE_CLOSE_UI = cubicBezier(0.4, 0, 1, 1);
      const EASE_CLOSE = cubicBezier(0.65, 0.04, 0.4, 1);
      const EASE_TITLE = cubicBezier(0.16, 1, 0.3, 1);

      const THEMES = {
        light: {
          pageHex: '#fcf7fc',
          inkHex: '#4a1448',
          mutedHex: '#8a6689',
          dotsHex: '#dccedc',
          page: hexToRgb('#fcf7fc'),

      // ─── Matrix helpers (column-major) ────────────────────────────────────
      function mat4PerspectiveShift(fovDeg, aspect, near, far, shiftYClip) {
        const f = 1 / Math.tan((fovDeg * Math.PI) / 360);
        const nf = 1 / (near - far);
        const out = new Float32Array(16);
        out[0] = f / aspect;
        out[5] = f;
        out[9] = shiftYClip; // shifts NDC y down by shiftYClip
        out[10] = (far + near) * nf;
        out[11] = -1;
        out[14] = 2 * far * near * nf;
        return out;
      }

      function mat4LookAt(eye, center, up) {
        let zx = eye[0] - center[0];
        let zy = eye[1] - center[1];
        let zz = eye[2] - center[2];
        let len = Math.hypot(zx, zy, zz) || 1;
        zx /= len; zy /= len; zz /= len;

        let xx = up[1] * zz - up[2] * zy;
        let xy = up[2] * zx - up[0] * zz;
        let xz = up[0] * zy - up[1] * zx;
        len = Math.hypot(xx, xy, xz) || 1;
        xx /= len; xy /= len; xz /= len;

        const yx = zy * xz - zz * xy;
        const yy = zz * xx - zx * xz;
        const yz = zx * xy - zy * xx;

        const out = new Float32Array(16);
        out[0] = xx; out[1] = yx; out[2] = zx; out[3] = 0;
        out[4] = xy; out[5] = yy; out[6] = zy; out[7] = 0;
        out[8] = xz; out[9] = yz; out[10] = zz; out[11] = 0;
        out[12] = -(xx * eye[0] + xy * eye[1] + xz * eye[2]);
        out[13] = -(yx * eye[0] + yy * eye[1] + yz * eye[2]);
        out[14] = -(zx * eye[0] + zy * eye[1] + zz * eye[2]);
        out[15] = 1;
        return out;
      }

      function mat4Multiply(a, b) {
        const out = new Float32Array(16);
        for (let col = 0; col < 4; col++) {
          const b0 = b[col * 4], b1 = b[col * 4 + 1], b2 = b[col * 4 + 2], b3 = b[col * 4 + 3];
          out[col * 4 + 0] = a[0] * b0 + a[4] * b1 + a[8] * b2 + a[12] * b3;
          out[col * 4 + 1] = a[1] * b0 + a[5] * b1 + a[9] * b2 + a[13] * b3;
          out[col * 4 + 2] = a[2] * b0 + a[6] * b1 + a[10] * b2 + a[14] * b3;
          out[col * 4 + 3] = a[3] * b0 + a[7] * b1 + a[11] * b2 + a[15] * b3;
        }
        return out;
      }

      function projectPoint(vp, x, y, z, w, h) {
        const cx = vp[0] * x + vp[4] * y + vp[8] * z + vp[12];
        const cy = vp[1] * x + vp[5] * y + vp[9] * z + vp[13];
        const cz = vp[2] * x + vp[6] * y + vp[10] * z + vp[14];
        const cw = vp[3] * x + vp[7] * y + vp[11] * z + vp[15];
        if (cw <= 0.001) return null;
        const ndcX = cx / cw;
        const ndcY = cy / cw;
        const ndcZ = cz / cw;
        return {
          x: (ndcX * 0.5 + 0.5) * w,
          y: (0.5 - ndcY * 0.5) * h,
          depth: cw,
          inNdc: ndcX >= -1.05 && ndcX <= 1.05 && ndcY >= -1.05 && ndcY <= 1.05 && ndcZ >= -1 && ndcZ <= 1
        };
      }

      // ─── WebGL2 Shaders & Programs ────────────────────────────────────────
      function compileShader(type, src) {
        const sh = gl.createShader(type);
        gl.shaderSource(sh, src);
        gl.compileShader(sh);
        if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) {
          throw new Error(gl.getShaderInfoLog(sh) || 'Shader compile error');
        }
        return sh;
      }

      function createProgram(vsSrc, fsSrc) {
        const p = gl.createProgram();
        gl.attachShader(p, compileShader(gl.VERTEX_SHADER, vsSrc));
        gl.attachShader(p, compileShader(gl.FRAGMENT_SHADER, fsSrc));
        gl.linkProgram(p);
        if (!gl.getProgramParameter(p, gl.LINK_STATUS)) {
          throw new Error(gl.getProgramInfoLog(p) || 'Program link error');
        }
        return p;
      }

      const THEME_GLSL = `
        uniform vec3 uPageOld;
        uniform vec3 uPageNew;
        uniform vec2 uViewport;
        uniform float uDpr;
        uniform vec2 uDropCenter;
        uniform float uDropRadius;
        uniform float uDropE;
        uniform float uDropActive;
        uniform float uTime;

        float getThemeMix() {
          if (uDropActive < 0.5) return 0.0;
          vec2 fragCss = vec2(gl_FragCoord.x / uDpr, uViewport.y - gl_FragCoord.y / uDpr);
          vec2 d = fragCss - uDropCenter;
          float ang = atan(d.y, d.x);
          float r = uDropRadius * (1.0 + 0.05 * (1.0 - uDropE) * sin(3.0 * ang + uTime * 1.4));
          return 1.0 - smoothstep(-1.0, 1.0, length(d) - r);
        }

        vec3 getPageColor() {
          return mix(uPageOld, uPageNew, getThemeMix());
        }
      `;

      // 1. Background program
      const bgProg = createProgram(
        `#version 300 es

        void main() {

      );

      // 2. Print program
      const printProg = createProgram(
        `#version 300 es
        layout(location = 0) in vec2 aGrid;
        uniform mat4 uVP;
        uniform float uCenterX;
        uniform float uWidth;
        uniform float uHeight;
        uniform float uCurvature;
        uniform float uRingR;
        uniform float uSway;
        uniform float uFlare;
        uniform float uHemLift;

        out vec2 vUv;
        out vec3 vNormal;
        out float vAngle;

        void evalPoint(float u, float v, out vec3 pos, out vec3 nrm, out float sVal) {
          float loose = pow(v, 1.7);
          float s = uCenterX + (u - 0.5) * uWidth + uSway * loose;
          sVal = s;
          vec3 base;
          if (abs(uCurvature) < 0.000001) {
            base = vec3(s, -uHeight * v + uHemLift * v * v, uRingR);
            nrm = vec3(0.0, 0.0, 1.0);
          } else {
            float a = uCurvature * s;
            float sh = sin(0.5 * a);
            base = vec3(
              sin(a) / uCurvature,
              -uHeight * v + uHemLift * v * v,
              uRingR - (2.0 * sh * sh) / uCurvature
            );
            nrm = vec3(sin(a), 0.0, cos(a));
          }
          pos = base + nrm * (uFlare * loose);
        }

        void main() {
          float u = aGrid.x;
          float v = aGrid.y;
          vec3 p0, n0, pu, nu, pv, nv;
          float s0, su, sv;
          evalPoint(u, v, p0, n0, s0);
          evalPoint(min(1.0, u + 0.02), v, pu, nu, su);
          evalPoint(u, min(1.0, v + 0.02), pv, nv, sv);
          vec3 du = u < 0.98 ? (pu - p0) : (p0 - pu);
          vec3 dv = v < 0.98 ? (pv - p0) : (p0 - pv);
          // Cross(dv, du) points along +Z when u right and v down

          vNormal = mix(n0, geomN, 0.7);
          vAngle = s0 / max(uRingR, 1.0);
          gl_Position = uVP * vec4(p0, 1.0);
        }`,
        `#version 300 es
        precision highp float;
        ${THEME_GLSL}

        uniform sampler2D uTexNew;
        uniform sampler2D uTexOld;
        uniform float uRoll;
        uniform float uVeil;
        uniform float uBorder;
        uniform vec3 uBorderColor;
        uniform float uWidth;
        uniform float uHeight;
        uniform vec2 uKeepNew;
        uniform vec2 uKeepOld;
        uniform float uAspectNew;
        uniform float uAspectOld;

        uniform float uSoakActive;
        uniform vec2 uSoakOrigin;
        uniform float uSoakFront;
        uniform float uSoakE;
        uniform float uSoakElapsed;
        uniform float uPrintScreenH;

        in vec2 vUv;
        in vec3 vNormal;
        in float vAngle;
        out vec4 outColor;

        vec2 mapCoverUV(vec2 boxUv, float rectAspect, float photoAspect, vec2 keep) {
          if (photoAspect > rectAspect) {
            float sc = rectAspect / photoAspect;
            return vec2(keep.x * (1.0 - sc) + boxUv.x * sc, boxUv.y);
          } else {
            float sc = photoAspect / rectAspect;
            return vec2(boxUv.x, keep.y * (1.0 - sc) + boxUv.y * sc);
          }
        }

        vec3 sampleSpiraled(sampler2D tex, vec2 uv, float spread) {
          if (spread <= 1.001) {
            return texture(tex, uv).rgb;
          }
          vec2 dx = dFdx(uv) * (1.0 + 0.42 * (spread - 1.0));
          vec2 dy = dFdy(uv) * (1.0 + 0.42 * (spread - 1.0));
          vec2 pxPerUv = vec2(1.0 / max(length(dx), 1e-6), 1.0 / max(length(dy), 1e-6));
          vec3 acc = vec3(0.0);
          for (int i = 0; i < 10; i++) {
            float fi = float(i);
            float ang = fi * 2.39996;
            float rad = sqrt((fi + 0.5) / 10.0) * 0.62 * (spread - 1.0);
            vec2 off = vec2(cos(ang), sin(ang)) * rad;
            vec2 duv = off.x * dFdx(uv) + off.y * dFdy(uv);
            acc += textureGrad(tex, clamp(uv + duv, 0.0, 1.0), dx, dy).rgb;
          }
          return acc * 0.1;
        }

        void main() {
          float farAmt = smoothstep(0.0, 1.0, (abs(vAngle) - 1.5707963) / (0.35 * 1.5707963));
          float effRoll = max(uRoll, uVeil * farAmt);
          if (vUv.y > 1.0 - effRoll) discard;

          vec2 boxUv = vUv;
          float rectAspect = uWidth / uHeight;
          float photoMask = 1.0;

          if (uBorder > 0.5) {
            float bx = 0.062;
            float bt = (0.062 * uWidth) / uHeight;
            float bb = 1.55 * bt;
            float fwU = max(fwidth(vUv.x), 0.0005);
            float fwV = max(fwidth(vUv.y), 0.0005);
            float mx = smoothstep(bx - fwU, bx + fwU, vUv.x) * (1.0 - smoothstep(1.0 - bx - fwU, 1.0 - bx + fwU, vUv.x));
            float my = smoothstep(bt - fwV, bt + fwV, vUv.y) * (1.0 - smoothstep(1.0 - bb - fwV, 1.0 - bb + fwV, vUv.y));
            photoMask = mx * my;
            boxUv = vec2(
              clamp((vUv.x - bx) / max(1.0 - 2.0 * bx, 0.001), 0.0, 1.0),
              clamp((vUv.y - bt) / max(1.0 - bt - bb, 0.001), 0.0, 1.0)
            );
            rectAspect = (uWidth * (1.0 - 2.0 * bx)) / (uHeight * (1.0 - bt - bb));
          }

          vec2 uvNew = mapCoverUV(boxUv, rectAspect, uAspectNew, uKeepNew);
          vec3 photoCol;

          if (uSoakActive > 0.5) {
            vec2 pCoord = vec2(vUv.x * (uWidth / uHeight), vUv.y);
            vec2 rel = pCoord - uSoakOrigin;
            float dist = length(rel);
            float ang = atan(rel.y, rel.x);
            float wave = 0.03 * (1.0 - 0.7 * uSoakE);
            float d = dist - uSoakFront - wave * sin(3.0 * ang + uTime * 0.7);
            float tNorm = d >= 0.0 ? clamp(d / 0.5, 0.0, 1.0) : clamp(-d / 0.34, 0.0, 1.0);
            float wetness = pow(1.0 - smoothstep(0.0, 1.0, tNorm), 2.0) * smoothstep(0.0, 1.0, uSoakElapsed / 0.14);

            vec2 dirUv = dist > 1e-4 ? (rel / dist) : vec2(0.0);
            vec2 pushUv = vec2(dirUv.x * (uHeight / uWidth), dirUv.y) * (wetness * 0.02);
            float spread = 1.0 + (pow(2.0, 3.7 * wetness) - 1.0) * (uPrintScreenH / 600.0);

            vec2 uvOld = mapCoverUV(boxUv, rectAspect, uAspectOld, uKeepOld);
            vec3 cNew = sampleSpiraled(uTexNew, clamp(uvNew + pushUv, 0.0, 1.0), spread);
            vec3 cOld = sampleSpiraled(uTexOld, clamp(uvOld + pushUv, 0.0, 1.0), spread);
            float oldShare = smoothstep(-0.26, 0.26, d);
            photoCol = mix(cNew, cOld, oldShare);
          } else {
            photoCol = texture(uTexNew, uvNew).rgb;
          }

          vec3 col = mix(uBorderColor, photoCol, photoMask);
          float lightDot = dot(normalize(vNormal), normalize(vec3(-0.45, 0.35, 0.82)));
          col *= (0.9 + 0.12 * lightDot);

          if (!gl_FrontFacing) {
            vec3 pageCol = getPageColor();
            float g = smoothstep(0.35, 0.9, pageCol.g);
            col = mix(col, pageCol, mix(0.22, 0.70, g));
            col += (1.0 - g) * 0.09;
          }

          outColor = vec4(col, 1.0);
        }`
      );

      // 3. Rail dots program (instanced decagons)
      const dotProg = createProgram(
        `#version 300 es
        layout(location = 0) in vec2 aPoly; // unit circle (-1..1)
        layout(location = 1) in float aS;
        layout(location = 2) in float aLean;

        uniform mat4 uVP;
        uniform float uCurvature;
        uniform float uRingR;
        uniform float uDotRadius;
        uniform float uDotY;
        uniform float uVeil;
        uniform float uPassMode; // 0 = normal dots, 1 = marker-overlap dots (+3.5 forward)
        uniform float uMarkerHalf;

        out float vFarMix;

        void main() {
          float lx = aPoly.x * uDotRadius;

          vec3 base;

          if (abs(uCurvature) < 0.000001) {
            base = vec3(s, uDotY + ly, uRingR);
            nrm = vec3(0.0, 0.0, 1.0);
          } else {
            float a = uCurvature * s;
            float sh = sin(0.5 * a);
            base = vec3(
              sin(a) / uCurvature,
              uDotY + ly,

          if (uPassMode > 0.5) {
            base.z += 3.5;
          }

          float ang = s / max(uRingR, 1.0);

        }`,
        `#version 300 es
        precision highp float;

        uniform vec3 uDotsOld;
        uniform vec3 uDotsNew;
        uniform float uPassMode;

      // 4. Marker program (hollow square at front centre)
      const markerProg = createProgram(
        `#version 300 es
        layout(location = 0) in vec2 aQuad; // -1..1

      // ─── Geometries ───────────────────────────────────────────────────────

      // ─── Texture Management ───────────────────────────────────────────────
      const anisoExt = gl.getExtension('EXT_texture_filter_anisotropic');
      const maxAniso = anisoExt ? Math.min(8, gl.getParameter(anisoExt.MAX_TEXTURE_MAX_ANISOTROPY_EXT)) : 1;

      function createSolidTexture(hex) {
        const [r, g, b] = hexToRgb(hex);

          gl.TEXTURE_2D, 0, gl.RGBA, 1, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE,
